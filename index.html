<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>recode.law | Event Einladungsgenerator</title>
    <link href="static/bootstrap.min.css" rel="stylesheet">
    <script src="static/bootstrap.min.js"></script>
    <link href="static/app.css" rel="stylesheet">
    <script src="static/app.js" defer></script>
</head>

<body class="min-vh-100 bg-light">
    <div class="container py-5">
        <div class="d-flex flex-wrap align-items-center justify-content-center gap-3 mb-4">
            <img src="static/recode_law_logo.svg" alt="recode.law Logo" class="logo-img">
            <h1 class="mb-0">Event Einladungsgenerator</h1>
        </div>

        <div class="row">
            <div class="col-md-6 col-12">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Format</label>
                            <div class="btn-group" role="group" aria-label="Format">
                                <input class="btn-check" type="radio" name="format" id="format-linkedin" value="linkedin" autocomplete="off" checked>
                                <label class="btn btn-outline-primary" for="format-linkedin">LinkedIn</label>
                                <input class="btn-check" type="radio" name="format" id="format-instagram" value="instagram" autocomplete="off">
                                <label class="btn btn-outline-primary" for="format-instagram">Instagram</label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="event-type-input" class="form-label">Event Art</label>
                            <input type="text" id="event-type-input" value="Stammtisch" class="form-control" />
                        </div>

                        <div class="mb-3">
                            <label for="background-select" class="form-label">Hintegrund</label>
                            <select id="background-select" class="form-select">
                                <option value="bg1">Hintegrund 1</option>
                                <option value="bg2">Hintegrund 2</option>
                                <option value="bg3">Hintegrund 3</option>
                                <option value="bg4">Hintegrund 4</option>
                                <option value="bg5">Hintegrund 5</option>
                                <option value="bg6">Hintegrund 6</option>
                                <option value="bg7">Hintegrund 7</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="location-input" class="form-label">Standort</label>
                            <input type="text" id="location-input" placeholder="z.B. Münster oder Passau" class="form-control" />
                        </div>

                        <div class="mb-3">
                            <label for="person-input" class="form-label">Repräsentant:in</label>
                            <div class="input-group">
                                <div class="input-group-text">
                                    <input class="form-check-input mt-0" id="person-enabled" type="checkbox" />
                                </div>
                                <input type="text" id="person-input" placeholder="mit Max Musterperson" class="form-control" />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="date-input" class="form-label">Datum</label>
                            <input type="datetime-local" id="date-input" class="form-control" />
                        </div>

                        <div class="mb-3">
                            <label for="point-input" class="form-label">Treffpunkt</label>
                            <input type="text" id="point-input" placeholder="Cooles Lokal" class="form-control" />
                        </div>

                        <div class="mb-3">
                            <label for="address-input" class="form-label">Adresse</label>
                            <div class="input-group">
                                <div class="input-group-text">
                                    <input class="form-check-input mt-0" id="adress-enabled" type="checkbox" checked />
                                </div>
                                <input type="text" id="address-input" placeholder="Hauptstraße 1" class="form-control" />
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="overlay-image-input" class="form-label">Overlay Bild</label>
                            <div class="input-group">
                                <input type="file" class="form-control" id="overlay-image-input">
                                <button class="btn btn-outline-secondary" type="button" id="overlay-image-clear-button">Entfernen</button>
                            </div>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="new-members-enabled">
                            <label class="form-check-label" for="new-members-enabled">
                                Auch für Interessierte
                            </label>
                        </div>
                        
                        <div>
                            <button id="download-btn" class="btn btn-primary px-4">
                                Download
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6 col-12">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <canvas id="canvas" class="w-100 rounded mb-3"></canvas>
                        <div id="text-box" class="text-box mt-3 p-3 bg-light rounded" style="white-space: pre-wrap;"></div>
                        <div>
                            <button id="copy-btn" class="btn btn-primary px-4">
                                Text Kopieren
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
